# Policy for the local demo stack (make dev): the server-wide fallback, and the first .pyn/pyn.toml of each demo repository.

[meta]
default = "exclusive"

[exclusive]
paths = [
  "Content/",
  "Config/ProductionConfig.cpp",
  "**/*.uasset",
]

[shared]
paths = [
  "Source/",
  "docs/",
  "README.md",
  "Config/",
]
