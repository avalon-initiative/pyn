# pyn web app only, from a release image, in front of a server running elsewhere. See docs/getting-started.md.
name: pyn

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  web:
    image: ghcr.io/avalon-initiative/pyn-web:${PYN_WEB_VERSION:?set PYN_WEB_VERSION in .env (for example v0.0.2)}
    restart: unless-stopped
    logging: *logging
    environment:
      PYN_API_URL: ${PYN_API_URL:?set PYN_API_URL in .env (the server address, for example https://pyn.example.com)}
    ports:
      - "${PYN_WEB_PUBLISH:-127.0.0.1:8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Optional HTTPS in front of the web service (COMPOSE_PROFILES=caddy, set by the installer's Caddy option). Without the
  # profile this service does not exist and nothing takes ports 80 or 443. The Caddyfile is generated next to this file.
  caddy:
    profiles: [caddy]
    image: ${PYN_CADDY_IMAGE:-caddy:2.11@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - web
    ports:
      - "${PYN_WEB_PUBLISH_HTTP:-0.0.0.0:80}:80"
      - "${PYN_WEB_PUBLISH_TLS:-0.0.0.0:443}:443"
      - "${PYN_WEB_PUBLISH_TLS:-0.0.0.0:443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    # The official binary carries cap_net_bind_service as a file capability, so it must stay in the bounding set or exec fails
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
