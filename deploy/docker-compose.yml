# pyn from release images: server, web app and PostgreSQL 16. See docs/getting-started.md.
name: pyn

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:${POSTGRES_VERSION:-16}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: pyn
      POSTGRES_DB: pyn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pyn-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyn -d pyn"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/avalon-initiative/pyn-core:${PYN_SERVER_VERSION:?set PYN_SERVER_VERSION in .env (for example v0.0.2)}
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PYN_DATABASE_URL: postgres://pyn:${POSTGRES_PASSWORD}@db:5432/pyn
      PYN_SECRET_KEY: ${PYN_SECRET_KEY:?set PYN_SECRET_KEY in .env (openssl rand -hex 32)}
      PYN_DATA_DIR: /data
      # An explicit value in .env wins; otherwise the address follows PYN_SITE (the Caddy option), else the plain trial address
      PYN_PUBLIC_URL: ${PYN_PUBLIC_URL:-${PYN_SITE:+https://}${PYN_SITE:-http://localhost:8080}}
      PYN_TRUST_FORWARDED_FOR: ${PYN_TRUST_FORWARDED_FOR:-true}
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - pyn-objects:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/avalon-initiative/pyn-web:${PYN_WEB_VERSION:?set PYN_WEB_VERSION in .env (for example v0.0.2)}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - server
    environment:
      PYN_API_URL: http://server:7878
    ports:
      - "${PYN_WEB_PUBLISH:-127.0.0.1:8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Optional HTTPS in front of the web service (COMPOSE_PROFILES=caddy, set by the installer's Caddy option). Without the
  # profile this service does not exist and nothing takes ports 80 or 443. The Caddyfile is generated next to this file.
  caddy:
    profiles: [caddy]
    image: ${PYN_CADDY_IMAGE:-caddy:2.11@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - web
    ports:
      - "${PYN_WEB_PUBLISH_HTTP:-0.0.0.0:80}:80"
      - "${PYN_WEB_PUBLISH_TLS:-0.0.0.0:443}:443"
      - "${PYN_WEB_PUBLISH_TLS:-0.0.0.0:443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    # The official binary carries cap_net_bind_service as a file capability, so it must stay in the bounding set or exec fails
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  pyn-db:
  pyn-objects:
  caddy-data:
  caddy-config:
