name: Release

# Pushing a v<MAJOR>.<MINOR>.<PATCH>[-title-slug] tag (created by `make release-publish`) publishes that
# version: binaries, the pyn-core image on ghcr.io and a GitHub Release. See docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/avalon-initiative/pyn-core
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to publish."
            exit 1
          fi

      - name: Verify the tag matches the workspace version
        id: tag
        run: scripts/verify-release-version.sh "${GITHUB_REF_NAME}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Checks
        run: make check

  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pyn
          POSTGRES_PASSWORD: pyn
          POSTGRES_DB: pyn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYN_DATABASE_URL: postgres://pyn:pyn@localhost:5432/pyn
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-live
          save-if: false

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Tests that need Postgres
        run: make test-live

  binaries:
    needs: [verify, live]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, packages: "-p pyn-server -p pyn-cli", bins: "pyn-server pyn" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, packages: "-p pyn-server -p pyn-cli", bins: "pyn-server pyn" }
          - { os: macos-14, target: aarch64-apple-darwin, packages: "-p pyn-cli", bins: "pyn" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --locked --release ${{ matrix.packages }}

      - name: Package
        run: |
          name="pyn-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          for bin in ${{ matrix.bins }}; do cp "target/release/$bin" "$name/"; done
          cp LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: pyn-*.tar.gz
          if-no-files-found: error

  image:
    needs: [verify, live]
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-amd64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    needs: [verify, live, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch tag
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "${IMAGE}:v${VERSION}" \
            $(printf "${IMAGE}@sha256:%s " *)

  release:
    needs: [verify, live, binaries, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum pyn-*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        run: |
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${pre[@]}"
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
