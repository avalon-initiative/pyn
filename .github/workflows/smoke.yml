name: Smoke

# Runs the published release images through deploy/docker-compose.yml. It reports; it never gates a release.
# A failure means "look at it", not "the release is bad". See docs/releasing.md.
on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v or any title suffix (0.1.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v or any title suffix (0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Smoke-test the release
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/smoke-release.sh "$VERSION"
