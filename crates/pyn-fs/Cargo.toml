[package]
name = "pyn-fs"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
getrandom = "0.4.3"
hex = "0.4.3"
pyn-core = { version = "0.0.1", path = "../pyn-core" }
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
zstd = "0.13.3"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3.32", default-features = false }

[dev-dependencies]
pyn-object = { path = "../pyn-object" }
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
