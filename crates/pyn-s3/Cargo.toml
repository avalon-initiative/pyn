[package]
name = "pyn-s3"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1"
chrono = "0.4.45"
futures-util = { version = "0.3.32", default-features = false }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
pyn-core = { version = "0.1.5", path = "../pyn-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["fs", "io-util", "rt", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
s3s = { version = "0.17.0", optional = true }
s3s-fs = { version = "0.17.0", optional = true }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "http1"], optional = true }
tempfile = { version = "3", optional = true }

[features]
# The in-process S3 server (`testing`) for tests of this crate and of crates that run against a store; never in a runtime build.
test-support = ["dep:s3s", "dep:s3s-fs", "dep:hyper-util", "dep:tempfile", "tokio/net", "tokio/rt-multi-thread", "tokio/sync"]
# Compiles the tests that need a real S3-compatible service (tests/real_endpoint.rs); off so CI and `make test-live` never run them.
real-endpoint = []

[dev-dependencies]
getrandom = "0.4.3"
hex = "0.4.3"
pyn-core = { path = "../pyn-core", features = ["contract"] }
pyn-object = { path = "../pyn-object" }
pyn-s3 = { path = ".", features = ["test-support"] }
sha2 = "0.11.0"
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
