[package]
name = "pyn-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
clap = "4.6.7"
hex = "0.4.3"
hmac = "0.13.0"
pyn-chunk = { version = "0.1.5", path = "../pyn-chunk" }
pyn-core = { version = "0.1.5", path = "../pyn-core" }
pyn-fs = { version = "0.1.5", path = "../pyn-fs" }
pyn-oidc = { version = "0.1.5", path = "../pyn-oidc" }
pyn-postgres = { version = "0.1.5", path = "../pyn-postgres" }
pyn-proto = { version = "0.1.5", path = "../pyn-proto" }
pyn-s3 = { version = "0.1.5", path = "../pyn-s3" }
pyn-smtp = { version = "0.1.5", path = "../pyn-smtp" }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
futures-util = "0.3.32"
http-body = "1.1.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = "6.0.0"

[lints]
workspace = true

[dev-dependencies]
pyn-core = { path = "../pyn-core", features = ["contract", "test-support"] }
http-body-util = "0.1.5"
pyn-oidc = { path = "../pyn-oidc", features = ["test-support"] }
pyn-object = { path = "../pyn-object" }
pyn-s3 = { path = "../pyn-s3", features = ["test-support"] }
tokio = { version = "1.53.2", features = ["test-util"] }
tower = "0.5.3"
tempfile = "3"
sha1 = "0.11.0"
pyn-webauthn = { path = "../pyn-webauthn", features = ["software"] }
