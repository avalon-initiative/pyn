[package]
name = "pyn-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
clap = "4.6.7"
pyn-core = { version = "0.0.1", path = "../pyn-core" }
pyn-fs = { version = "0.0.1", path = "../pyn-fs" }
pyn-postgres = { version = "0.0.1", path = "../pyn-postgres" }
pyn-proto = { version = "0.0.1", path = "../pyn-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = "6.0.0"

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
