[package]
name = "pyn-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
contract = ["tokio/rt"]
test-support = []

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
argon2 = "0.6.0"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
globset = "0.4.20"
hex = "0.4.3"
pyn-chunk = { version = "0.0.1", path = "../pyn-chunk" }
pyn-hash = { version = "0.0.1", path = "../pyn-hash" }
pyn-merge = { version = "0.0.1", path = "../pyn-merge" }
pyn-object = { version = "0.0.1", path = "../pyn-object" }
pyn-proto = { version = "0.0.1", path = "../pyn-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "p521", "rsa"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "rt", "sync"] }
toml = "1.1.7"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
pyn-core = { path = ".", features = ["contract", "test-support"] }
