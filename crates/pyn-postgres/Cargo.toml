[package]
name = "pyn-postgres"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
pyn-core = { version = "0.0.1", path = "../pyn-core" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "migrate", "macros", "tls-rustls-aws-lc-rs"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
pyn-core = { path = "../pyn-core", features = ["contract"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
