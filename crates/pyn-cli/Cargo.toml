[package]
name = "pyn-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "pyn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
pyn-proto = { version = "0.0.1", path = "../pyn-proto" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.7"

[lints]
workspace = true
