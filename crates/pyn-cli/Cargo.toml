[package]
name = "pyn-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "pyn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
globset = "0.4.20"
hex = "0.4.3"
pyn-chunk = { version = "0.0.1", path = "../pyn-chunk" }
pyn-diff = { version = "0.0.1", path = "../pyn-diff" }
pyn-git = { version = "0.0.1", path = "../pyn-git" }
pyn-gittransport = { version = "0.0.1", path = "../pyn-gittransport" }
pyn-gitwork = { version = "0.0.1", path = "../pyn-gitwork" }
pyn-gitwire = { version = "0.0.1", path = "../pyn-gitwire" }
pyn-hash = { version = "0.0.1", path = "../pyn-hash" }
pyn-merge = { version = "0.0.1", path = "../pyn-merge" }
pyn-object = { version = "0.0.1", path = "../pyn-object" }
pyn-proto = { version = "0.0.1", path = "../pyn-proto" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.7"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
pyn-core = { path = "../pyn-core", features = ["test-support"] }
pyn-gitwork = { path = "../pyn-gitwork", features = ["test-support"] }
pyn-server = { path = "../pyn-server" }
shutdown_hooks = "0.1.0"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync"] }
zstd = "0.14.3"
