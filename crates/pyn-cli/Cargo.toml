[package]
name = "pyn-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "pyn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
globset = "0.4.20"
hex = "0.4.3"
pyn-proto = { version = "0.0.1", path = "../pyn-proto" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.7"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
pyn-core = { path = "../pyn-core", features = ["test-support"] }
pyn-server = { path = "../pyn-server" }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
