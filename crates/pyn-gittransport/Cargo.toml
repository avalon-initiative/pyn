[package]
name = "pyn-gittransport"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
flate2 = "1.1.10"
pyn-git = { version = "0.0.1", path = "../pyn-git" }
pyn-gitwire = { version = "0.0.1", path = "../pyn-gitwire" }
pyn-object = { version = "0.0.1", path = "../pyn-object" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rpassword = "7.5.4"
tempfile = "3.27.0"
thiserror = "2.0.21"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync"] }

[lints]
workspace = true
